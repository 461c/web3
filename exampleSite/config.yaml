baseURL: https://kuanwww.pages.dev/
title: Stacknote 中文示例站
theme: stacknote
defaultContentLanguage: zh-cn
languageCode: zh-CN
locale: zh-CN
hasCJKLanguage: true
enableRobotsTXT: true

pagination:
  pagerSize: 6

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS, JSON]

params:
  author: 示例作者
  authorInitials: "示"
  role: 软件工程师
  tagline: 经实践检验的工程笔记
  description: Stacknote Hugo 主题的简体中文示例站。
  homeEyebrow: 工程实践 · 技术笔记
  homeTitle: 记录真实系统的构建过程
  homeIntro: 分享实践经验、技术取舍与可复现的工程方法。
  aboutIntro: 这里记录经过生产环境检验的系统经验。
  mainSection: articles
  authorPage: /about/
  showToc: true
  showTopics: true
  showAbout: true
  showNewsletter: true
  minTagPostsToIndex: 2
  themeColor: "#FAFAF7"
  defaultSocialImage: images/social-card.png
  socialLinks:
    - name: github
      url: https://github.com/461c/web3
    - name: rss
      url: /index.xml

menu:
  main:
    - name: 归档
      url: /archives/
      weight: 10
    - name: 搜索
      url: /search/
      weight: 20
    - name: 标签
      url: /tags/
      weight: 30
    - name: 关于
      url: /about/
      weight: 40

related:
  includeNewer: true
  threshold: 40
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10
